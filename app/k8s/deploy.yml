apiVersion: apps/v1
kind: Deployment

metadata:
  name: mew-app
  namespace: pakistan
  labels:
    app: mew-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mew-app

  template:
    metadata:
      labels:
        app: mew-app

    spec:
      containers:
        - name: mew-app
          image: mew-app:v2.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"