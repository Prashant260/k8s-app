apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mew-app-scaledobject
  namespace: pakistan
spec:
  scaleTargetRef:
    name: mew-app
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 30
  pollingInterval: 15
  advanced:
    restoreToOriginalReplicaCount: true
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
